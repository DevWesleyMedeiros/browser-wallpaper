<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>Tela de Descanso - Bouncing Balls</title>
</head>
<body>
    <button id="btn_toggle_controles" class="toggle-btn">⚙️</button>
    <div class="controles" id="controles">
        <div class="controle">
            <label>Número de objetos</label>
            <p id="num_objetos">0</p>
        </div>
        <div class="controle">
            <label for="txt_qtde">Quantidade de objetos</label>
            <input type="number" value="10" min="0" id="txt_qtde">
            <button id="btn_add">Adicionar</button>
        </div>
        <div class="controle">
            <label for="txt_velocidade">Velocidade</label>
            <input type="number" value="1" min="0.1" step="0.1" id="txt_velocidade">
        </div>
        <div class="controle">
            <label>Tamanho (min/max)</label>
            <div class="size-controls">
                <label for="txt_tamanho_min">min</label>
                <input type="number" value="10" min="5" id="txt_tamanho_min">
                <span>-</span>
                <label for="txt_tamanho_max">max</label>
                <input type="number" value="30" min="5" id="txt_tamanho_max">
            </div>
        </div>
        <div class="controle">
            <label class="checkbox-label">
                <input type="checkbox" id="ckb_trails">
                Mostrar trilhas
            </label>
        </div>
        <div class="controle">
            <button id="btn_remover">Remover Todos</button>
        </div>
    </div>
    <div class="palco" id="palco">
        <div class="my_name">
            <p>WESLEY MEDEIROS</p>
        </div>
    </div>
    <script src="script/script.js"></script>
</body>
</html>
